<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengingat PR SMANU CMP</title>
    <!-- Tailwind CSS untuk styling cepat dan responsif di HP -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-12">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">📚 Pengingat PR SMANU CMP</h1>
            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full">Siswa & Guru</span>
        </div>
    </header>

    <!-- Konten Utama Dashboard -->
    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

        <!-- Form Input Tugas (Untuk Guru/Pengurus) -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">➕ Tambah Tugas Baru</h2>
            <form id="prForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Mata Pelajaran</label>
                    <input type="text" id="mapel" required placeholder="Contoh: Matematika / Informatika" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Detail Tugas / PR</label>
                    <textarea id="deskripsi" rows="2" required placeholder="Contoh: Kerjakan soal halaman 45..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Tenggat Waktu (Deadline)</label>
                    <input type="datetime-local" id="deadline" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition text-sm">Simpan & Publikasikan Tugas</button>
            </form>
        </section>

        <!-- Daftar PR / List Tugas (Untuk Siswa) -->
        <section>
            <h2 class="text-lg font-semibold text-gray-700 mb-3">📋 Daftar PR Aktif</h2>
            <div id="daftarPr" class="space-y-3">
                <!-- Contoh Tampilan Kartu Tugas -->
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-indigo-500 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">Informatika X.2</span>
                            <span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded font-medium">Sisa Waktu: 2 Hari</span>
                        </div>
                        <p class="text-sm font-semibold text-gray-800 mt-1">Membuat laporan proyek web statis Vercel.</p>
                        <p class="text-xs text-gray-500 mt-1">Deadline: 15 November 2026, 23:59</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Script Placeholder untuk Database (Firebase / LocalStorage) -->
    <script>
        const prForm = document.getElementById('prForm');
        
        prForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const mapel = document.getElementById('mapel').value;
            const deskripsi = document.getElementById('deskripsi').value;
            const deadline = document.getElementById('deadline').value;

            // Di sinilah nanti kita akan menyambungkan data ke database (Firebase)
            alert(`Tugas ${mapel} berhasil ditambahkan! Siap dihubungkan ke database.`);
            
            prForm.reset();
        });
    </script>
</body>
</html>
